# Har bir push'da avtomatik tekshiruv: backend testlari (alohida PostgreSQL bazada) va sayt build'i.
# Natija GitHub'da commit/PR yonida ✅ yoki ❌ bo'lib ko'rinadi.
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend testlari
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uyremont_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/uyremont_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Testlar
        run: npm test
      - name: Zaifliklar (yuqori darajali)
        run: npm audit --omit=dev --audit-level=high

  web:
    name: Sayt (testlar va build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Testlar
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: Docker (production imijlari)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: docker-compose.yml tekshiruvi
        working-directory: deploy
        run: cp env.example .env && sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/' .env && docker compose config --quiet
      - name: Skriptlar sintaksisi
        run: bash -n deploy/usta24.sh && sh -n deploy/backup.sh
      - name: Backend imiji
        run: docker build --target backend --build-arg PUBLIC_APP_URL=https://usta24.example.uz -t usta24-backend .
      - name: Sayt imiji (Caddy)
        run: docker build --target web --build-arg PUBLIC_APP_URL=https://usta24.example.uz -t usta24-web .
      - name: Caddyfile tekshiruvi
        run: docker run --rm -e DOMAIN=usta24.example.uz usta24-web caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Havola kartochkasi shriftlari
        run: |
          docker run --rm --entrypoint fc-list usta24-backend : family | sort -u
          docker run --rm --entrypoint sh usta24-backend -c "fc-list : family | grep -qi 'DejaVu Sans'"
