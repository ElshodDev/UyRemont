# =============================================
# Usta24 - production (bitta server): baza, backend, sayt + HTTPS, kunlik zaxira
# Boshqarish: deploy/usta24.sh (install, update, backup, restore, logs, status)
# Sozlamalar: deploy/.env (namuna: deploy/env.example)
# =============================================
name: usta24

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: usta24
      POSTGRES_USER: usta24
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?deploy/.env da POSTGRES_PASSWORD yo'q}
      TZ: Asia/Tashkent
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usta24 -d usta24"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  backend:
    build:
      context: ..
      target: backend
      args:
        PUBLIC_APP_URL: ${PUBLIC_APP_URL:?deploy/.env da PUBLIC_APP_URL yo'q}
    image: usta24-backend
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    # JWT_SECRET, SMS, Telegram, qo'llab-quvvatlash kontaktlari va boshqalar
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://usta24:${POSTGRES_PASSWORD}@db:5432/usta24
      DATABASE_SSL: "false"
      CLIENT_URL: ${PUBLIC_APP_URL}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      # Oldida bitta proksi (Caddy): foydalanuvchining haqiqiy IP manzili undan olinadi
      TRUST_PROXY: "1"
      TZ: Asia/Tashkent
    volumes:
      - appdata:/data
    logging: *logging

  web:
    build:
      context: ..
      target: web
      args:
        PUBLIC_APP_URL: ${PUBLIC_APP_URL}
    image: usta24-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?deploy/.env da DOMAIN yo'q}
      WWW_DOMAIN: ${WWW_DOMAIN:-}
    volumes:
      # HTTPS sertifikatlari (qayta olinmasligi uchun saqlanadi)
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    command: ["schedule"]
    environment:
      PGHOST: db
      PGUSER: usta24
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: usta24
      TZ: Asia/Tashkent
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-8}
    volumes:
      - ./backup.sh:/usr/local/bin/backup.sh:ro
      - ./backups:/backups
      - appdata:/data
    healthcheck:
      test: ["CMD", "/bin/sh", "/usr/local/bin/backup.sh", "check"]
      interval: 1h
      timeout: 10s
      start_period: 10m
    logging: *logging

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:
